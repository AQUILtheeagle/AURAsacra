<!DOCTYPE html>
<html lang="en" data-theme="dawn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Aura Sacra — Universal Christian Platform</title>
  
  <!-- PWA & Mobile Meta Tags -->
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" href="./icons/favicon.png">
  <meta name="theme-color" content="#c69214">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Aura Sacra">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  
  <!-- Tailwind CSS CDN for rapid utility classes -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: ['class', '[data-theme="night"]'],
      theme: {
        extend: {
          colors: {
            parchment: {
              light: '#fdfbf7',
              base: '#f6efe2',
              dark: '#241b16',
              night: '#151519'
            },
            sacred: {
              gold: '#c69214',
              vermilion: '#b93b2c',
              blue: '#235789',
              amber: '#e5a93b'
            }
          },
          fontFamily: {
            serif: ['EB Garamond', 'Georgia', 'serif'],
            display: ['Cinzel', 'serif'],
            sans: ['Inter', 'system-ui', 'sans-serif']
          }
        }
      }
    }
  </script>

  <!-- Custom Styles: Circadian themes, manuscript textures, living flame -->
  <link rel="stylesheet" href="./css/style.css">
</head>
<body class="antialiased selection:bg-amber-200 selection:text-amber-900 pb-20 md:pb-6">

  <!-- Main Application Root -->
  <div id="app" class="min-h-screen flex flex-col transition-colors duration-700">
    
    <!-- Top Navbar -->
    <header id="navbar-container"></header>

    <!-- Main Content Area: Sidebar + Active View (Desktop & Mobile) -->
    <div class="flex-1 flex max-w-7xl w-full mx-auto px-3 sm:px-6 lg:px-8 py-4 gap-6">
      
      <!-- Desktop Monastic Sidebar (Hidden on Mobile) -->
      <aside id="sidebar-container" class="hidden md:block w-64 flex-shrink-0"></aside>

      <!-- Dynamic Active Tab Content Container -->
      <main id="main-content" class="flex-1 min-w-0 transition-opacity duration-300"></main>
    </div>

    <!-- Mobile Bottom Navigation (Hidden on Desktop) -->
    <nav id="bottom-nav-container" class="md:hidden fixed bottom-0 left-0 right-0 z-40"></nav>

    <!-- Desktop Floating Living Candle Widget (Always-On-Top) -->
    <div id="floating-candle-container" class="hidden md:block"></div>

    <!-- Modals Container (SOS, Promises, Examination, Schedule, Feedback, Settings, Onboarding, Share Card) -->
    <div id="modals-container"></div>
  </div>

  <!-- Main ES Module Script -->
  <script type="module" src="./js/app.js"></script>

  <!-- Service Worker Registration for PWA Offline Functionality -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then((reg) => {
          reg.update();
        }).catch(err => {
          console.log('SW registration note:', err);
        });
      });
    }
  </script>
</body>
</html>
